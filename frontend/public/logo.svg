<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="100%" height="100%">
  <!-- White background for favicon visibility on dark tabs -->
  <rect x="-100" y="-100" width="200" height="200" fill="#ffffff" rx="40" />
  
  <defs>
    <!-- Gear tooth profile -->
    <path id="tooth" d="M -7,-70 L -4,-85 L 4,-85 L 7,-70 Z" fill="#2d3748" />
    
    <g id="segment">
      <!-- Outer Gear Arc (90 degrees span, starting at 0 degrees/top) -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#2d3748" stroke-width="10" stroke-dasharray="110 330" transform="rotate(-90)" />
      
      <!-- Outer Arrow Head at 90 degrees -->
      <g transform="rotate(90)">
        <polygon points="-1,-82 -1,-58 17,-70" fill="#2d3748" />
      </g>
      
      <!-- Gear Teeth on the outer arc -->
      <use href="#tooth" transform="rotate(15)" />
      <use href="#tooth" transform="rotate(45)" />
      <use href="#tooth" transform="rotate(75)" />
      
      <!-- Inner Green Arc (60 degrees span, starting at 15 degrees) -->
      <circle cx="0" cy="0" r="45" fill="none" stroke="#1b6e41" stroke-width="10" stroke-dasharray="47.12 240" transform="rotate(-75)" />
      
      <!-- Inner Green Arrow Head at 75 degrees -->
      <g transform="rotate(75)">
        <polygon points="-1,-57 -1,-33 16,-45" fill="#1b6e41" />
      </g>
    </g>
  </defs>

  <!-- 3 instances of the segment rotated by 120 degrees to form the complete gear-chakra -->
  <use href="#segment" transform="rotate(0)" />
  <use href="#segment" transform="rotate(120)" />
  <use href="#segment" transform="rotate(240)" />
</svg>
